<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThirdEye</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1f23; --muted: #6b7078; --line: #dcdcd6;
    --ok: #2e7d32; --err: #c62828; --warn: #b8860b; --accent: #1f5fbf; --cell: #eceae3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --panel: #1e2125; --ink: #e8e8e4; --muted: #9aa0a8; --line: #33373d;
      --ok: #66bb6a; --err: #ef6a6a; --warn: #e0b341; --accent: #6fa3f0; --cell: #292d32;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
                   border-radius: 6px; background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #conn { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.step { display: flex; gap: 8px; padding: 4px 0; align-items: baseline; }
  .mark { width: 1.4em; text-align: center; font-weight: 600; }
  .done .mark { color: var(--ok); } .error .mark { color: var(--err); } .active .mark { color: var(--warn); }
  .pending { color: var(--muted); }
  .alert { border-left: 4px solid var(--err); padding: 6px 10px; margin-bottom: 8px; background: var(--cell); border-radius: 0 6px 6px 0; }
  .alert.warning { border-color: var(--warn); }
  .alert b { display: block; font-size: 13px; }
  .alert small { color: var(--muted); }
  #grid { display: grid; gap: 4px; }
  .cell { background: var(--cell); border-radius: 4px; min-height: 38px; display: flex; align-items: center;
          justify-content: center; font-size: 12px; text-align: center; }
  .cell.full { background: var(--accent); color: #fff; }
  .cell.unid { background: var(--warn); color: #fff; }
  .cell.legal { outline: 2px dashed var(--ok); }
  #tower { display: flex; flex-direction: column-reverse; gap: 3px; }
  .layer { display: grid; grid-template-columns: 2.4em repeat(3, 1fr); gap: 3px; align-items: center; font-size: 11px; color: var(--muted); }
  .layer .cell { min-height: 14px; }
  .big { font-size: 28px; font-weight: 650; }
  pre { white-space: pre-wrap; margin: 0; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>ThirdEye</h1>
  <label>Session <select id="script"></select></label>
  <button class="primary" id="start">Start</button>
  <button id="stop">Stop</button>
  <span id="conn">connecting…</span>
</header>
<main>
  <section><h2>Progress</h2><div id="progress" class="empty">Choose a session and press Start.</div></section>
  <section><h2 id="boardTitle">Board</h2><div id="board" class="empty">Nothing yet.</div></section>
  <section><h2>Alerts <span id="counts"></span></h2><div id="alerts" class="empty">No alerts.</div></section>
  <section id="reportBox" hidden><h2>Report</h2><pre id="report"></pre></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const marks = { done: "✓", error: "!", active: "…", pending: "○" };
let ws, retry = 0;

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function renderState(m) {
  // Progress: a checklist (ordered procedure) or the legality panel (a rulebook).
  if (m.checklist.length) {
    $("progress").className = "";
    $("progress").innerHTML = "<ul>" + m.checklist.map(r =>
      `<li class="step ${r.status}"><span class="mark">${marks[r.status]}</span><span>${esc(r.id)} — ${esc(r.instruction)}</span></li>`
    ).join("") + "</ul>" + (m.next ? `<p><small>Next: <b>${esc(m.next.id)}</b> ${esc(m.next.instruction)}</small></p>` : "");
  } else if (m.legality) {
    const g = m.legality;
    $("progress").className = "";
    $("progress").innerHTML =
      `<div class="big">${g.takeable_up_to_layer >= 0 ? "Layers 0–" + g.takeable_up_to_layer : "No layer"}</div>` +
      `<p>may be taken from.<br>Top layer ${g.top_layer}, top complete layer ${g.top_complete_layer}.</p>` +
      `<p>Place in: <b>${g.legal_slots.map(esc).join(", ") || "—"}</b></p>` +
      "<ul>" + g.rules.map(r => `<li class="step"><span class="mark">•</span><span>${esc(r.text)}</span></li>`).join("") + "</ul>";
  }
  // Board.
  const o = m.overlay;
  if (o.model === "piece_grid") {
    $("boardTitle").textContent = "Board";
    const at = new Map(o.cells.map(c => [c.col + "," + c.row, c]));
    let html = `<div id="grid" style="grid-template-columns:repeat(${o.cols},1fr)">`;
    for (let r = 0; r < o.rows; r++) for (let c = 0; c < o.cols; c++) {
      const cell = at.get(c + "," + r);
      html += cell ? `<div class="cell ${cell.piece ? "full" : "unid"}">${cell.piece ? esc(cell.piece) + (cell.rot ? "<br>" + cell.rot + "°" : "") : "?"}</div>` : `<div class="cell"></div>`;
    }
    $("board").className = ""; $("board").innerHTML = html + "</div>";
  } else if (o.model === "tower_lattice") {
    $("boardTitle").textContent = "Tower";
    const legal = new Set((m.legality?.legal_slots) || []);
    const rows = o.rows.map((row, l) =>
      `<div class="layer"><span>L${l}</span>` + row.map((v, s) => `<div class="cell ${v ? "full" : ""} ${legal.has("L" + l + "s" + s) ? "legal" : ""}"></div>`).join("") + "</div>"
    );
    $("board").className = ""; $("board").innerHTML = `<div id="tower">${rows.join("")}</div>`;
  } else if (o.model === "stud_grid") {
    $("boardTitle").textContent = "Plate";
    $("board").className = ""; $("board").innerHTML = "<ul>" + o.bricks.map(b => `<li>${esc(b.part)} at ${b.x},${b.y} (layer ${b.layer}, ${b.rot}°)</li>`).join("") + "</ul>";
  }
  $("counts").textContent = `(${m.counts.alerts} red, ${m.counts.warnings} yellow)`;
}

function addAlert(m) {
  const box = $("alerts");
  if (box.classList.contains("empty")) { box.className = ""; box.innerHTML = ""; }
  const m_ = Math.floor(m.t / 60), s_ = String(Math.floor(m.t % 60)).padStart(2, "0");
  const el = document.createElement("div");
  el.className = "alert " + (m.severity === "warning" ? "warning" : "");
  el.innerHTML = `<b>${esc(m.code.replaceAll("_", " "))}</b>${esc(m.text)}<br><small>${String(m_).padStart(2, "0")}:${s_} · rule ${esc(m.rule)}${m.severity === "warning" ? " · warning" : ""}</small>`;
  box.prepend(el);
}

function onMessage(m) {
  if (m.v !== 1) { $("conn").textContent = "server speaks protocol " + m.v; return; }
  if (m.type === "hello") {
    const sel = $("script");
    if (!sel.options.length) m.procedures.forEach(p => sel.add(new Option(`${p.name}  (${p.procedure})`, p.name)));
  } else if (m.type === "status") {
    $("start").disabled = m.running; $("stop").disabled = !m.running;
    if (m.running) { $("alerts").className = "empty"; $("alerts").textContent = "No alerts."; $("reportBox").hidden = true; }
  } else if (m.type === "state") renderState(m);
  else if (m.type === "alert") addAlert(m);
  else if (m.type === "done") { $("reportBox").hidden = false; $("report").textContent = m.summary + "\n\n" + m.report; }
}

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { retry = 0; $("conn").textContent = "connected"; };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
  ws.onclose = () => { $("conn").textContent = "reconnecting…"; setTimeout(connect, Math.min(1000 * 2 ** retry++, 8000)); };
}

$("start").onclick = () => fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" },
  body: JSON.stringify({ script: $("script").value }) }).then(r => r.ok || r.json().then(j => alert(j.detail)));
$("stop").onclick = () => fetch("/api/session", { method: "DELETE" });
connect();
</script>
</body>
</html>
